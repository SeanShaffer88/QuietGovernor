name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile every module
        run: python -m compileall -q src tests scripts

      - name: Unit tests
        run: python -m unittest discover -s . -p "test_*.py" -v

      # Install before the smoke test: 'python -m quietgovernor' and the
      # console script both need the package installed. tests/ only puts src/
      # on sys.path for the test run itself.
      - name: Install the package and its console script
        run: |
          python -m pip install --quiet --upgrade pip wheel setuptools
          python -m pip install --quiet --no-deps .
          quietgovernor --version

      - name: End-to-end smoke test in simulation mode
        run: python scripts/smoke_simulate.py

  windows-evidence:
    name: Windows hardware evidence (informational)
    runs-on: windows-latest
    # These steps exercise powrprof.dll on a real Windows kernel, which is the
    # evidence docs/SPEC.md §9 is waiting for. Their output is uploaded and kept.
    # A hosted-VM quirk must not block merges, so this job is informational
    # until the behaviour is confirmed on real hardware.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (includes the Windows-only checks)
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Install the package and its console script
        run: |
          python -m pip install --quiet --upgrade pip wheel setuptools
          python -m pip install --quiet --no-deps .
          quietgovernor --version

      - name: Record the active plan and current settings
        shell: pwsh
        run: |
          $env:QUIETGOVERNOR_STATE_DIR = "$env:RUNNER_TEMP\qg-state"
          quietgovernor status | Tee-Object -FilePath status.txt
          quietgovernor --json status | Out-File -FilePath status.json -Encoding utf8

      - name: Apply, verify, and restore on real Windows
        shell: pwsh
        run: |
          $env:QUIETGOVERNOR_STATE_DIR = "$env:RUNNER_TEMP\qg-state"
          quietgovernor apply --profile quiet --yes | Tee-Object -FilePath apply.txt
          quietgovernor status | Tee-Object -FilePath after-apply.txt
          quietgovernor --json status | Out-File -FilePath after-apply.json -Encoding utf8
          quietgovernor restore --yes | Tee-Object -FilePath restore.txt
          quietgovernor status | Tee-Object -FilePath after-restore.txt
          quietgovernor --json status | Out-File -FilePath after-restore.json -Encoding utf8

      - name: Auto-start task (install, inspect, remove)
        shell: pwsh
        run: |
          $env:QUIETGOVERNOR_STATE_DIR = "$env:RUNNER_TEMP\qg-state"
          # First real exercise of schtasks.exe and the task XML. Both outcomes
          # are informative: an install, or a refusal by the privilege guard if
          # the interpreter lives somewhere user-writable (it does on hosted
          # runners). This step reports what happened instead of asserting it,
          # because a PowerShell pipeline can mask an exit code.
          quietgovernor autostart install --profile quiet --preview 2>&1 |
            Tee-Object -FilePath autostart-preview.txt
          quietgovernor autostart install --profile quiet --yes 2>&1 |
            Tee-Object -FilePath autostart-install.txt
          quietgovernor --json status | Out-File -FilePath autostart-status.json -Encoding utf8

          $report = Get-Content autostart-status.json -Raw | ConvertFrom-Json
          $auto = $report.autostart
          "AUTOSTART_AVAILABLE: $($auto.available)"
          "AUTOSTART_INSTALLED: $($auto.installed)"
          "AUTOSTART_PROFILE:   $($auto.profile)"
          "AUTOSTART_RUNLEVEL:  $($auto.run_level)"
          "AUTOSTART_COMMAND:   $($auto.command)"
          "AUTOSTART_ARGS:      $($auto.arguments)"
          "AUTOSTART_PROBLEMS:  $($auto.problems -join ' | ')"

          quietgovernor autostart remove --yes 2>&1 | Tee-Object -FilePath autostart-remove.txt
          quietgovernor --json status | Out-File -FilePath autostart-after-remove.json -Encoding utf8

          $after = Get-Content autostart-after-remove.json -Raw | ConvertFrom-Json
          "AUTOSTART_AFTER_REMOVE_INSTALLED: $($after.autostart.installed)"
          Get-Content autostart-preview.txt, autostart-install.txt, autostart-remove.txt

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence
          path: |
            status.txt
            status.json
            apply.txt
            after-apply.txt
            after-apply.json
            restore.txt
            after-restore.txt
            after-restore.json
            autostart-preview.txt
            autostart-install.txt
            autostart-remove.txt
            autostart-status.json
            autostart-after-remove.json
          if-no-files-found: warn
